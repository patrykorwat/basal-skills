name: Sync engine docs

on:
  schedule:
    - cron: "17 3 * * *"   # daily, off the round hour
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # gh needs the token explicitly: without it every gh call exits 4
      # ("To use GitHub CLI in a GitHub Actions workflow, set GH_TOKEN").
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror rkinas/basal docs
        id: sync
        run: |
          set +e
          python3 scripts/sync_docs.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 10 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Open or update PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BRANCH=docs/engine-mirror
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add skills/basal-serve/references/engine
          if git diff --cached --quiet; then
            echo "nothing staged although sync reported a change; skipping"
            exit 0
          fi
          SHA=$(python3 -c "import json;print(json.load(open('skills/basal-serve/references/engine/MANIFEST.json'))['commit'][:10])")
          git commit -m "chore: mirror rkinas/basal docs ($SHA)"
          # checkout fetched only main, so this branch has no remote-tracking ref
          # and --force-with-lease cannot guess its value ("stale info"). Read it.
          REMOTE=$(git ls-remote --refs origin "refs/heads/$BRANCH" | cut -f1 || true)
          if [ -n "$REMOTE" ]; then
            git push --force-with-lease="$BRANCH:$REMOTE" origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          BODY="Daily docs sync found changes in \`rkinas/basal\` docs (\`$SHA\`). Review the diff, then merge; CI enforces the mirror hygiene tests."
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number -q '.[0].number' || true)
          if [ -z "${OPEN:-}" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore: engine docs mirror update" --body "$BODY"
          else
            gh pr edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
